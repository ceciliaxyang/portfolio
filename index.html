<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia — Design</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <section class="hero" id="work">
      <h1>Cecilia is a designer in Oakland, currently leading teams at Airbnb</h1>
    </section>
  </div>

  <!-- Case study: sticky pinned card stack, cards only -->
  <div class="cs-wrap">
    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--today">
        <video class="cs-today-video" src="assets/today-tab.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--lock">
        <div class="cs-lock-phone">
          <img class="cs-lock-base" src="assets/lock-screen-base.png" alt="Smart Lock connect screen on an iPhone">
          <video class="cs-lock-video" src="assets/lock-connect-video.mp4" muted loop playsinline preload="auto"></video>
        </div>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--setup">
        <video class="cs-setup-video" src="assets/setup-flow.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--hostactions">
        <video class="cs-hostactions-video" src="assets/host-actions.mp4" muted loop playsinline preload="auto" data-in-view-threshold="0.15" data-play-delay="400"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--airkey">
        <video class="cs-airkey-video" src="assets/airkey-guest.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-scroll">
      <div class="cs-device cs-device--tips">
        <div class="cs-tips-phone">
          <img class="cs-tips-frame" src="assets/phone-frame-tips.png" alt="">
          <div class="cs-tips-screen">
            <video class="cs-tips-video" src="assets/tips-enter-exit.mp4" muted loop playsinline preload="auto"></video>
            <img class="cs-tips-nav" src="assets/global-nav.png" alt="">
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section class="contact" id="contact">
      <h2>Get in touch</h2>
      <button type="button" class="btn contact-trigger" id="contactTrigger">Contact me</button>
    </section>
  </div>

  <footer>© 2026</footer>

  <div class="contact-panel" id="contactPanel">
    <button type="button" class="contact-panel-close" id="contactPanelClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M1.5 1.5L16.5 16.5M16.5 1.5L1.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="contact-panel-inner" id="contactPanelInner">
      <form class="contact-form" id="contactForm" novalidate>
        <input type="hidden" name="access_key" value="231e0cc0-85c7-4949-98cd-f015edc99929">
        <div class="contact-field">
          <label for="contactName" class="sr-only">Name</label>
          <input type="text" id="contactName" name="name" autocomplete="name" placeholder="Name" aria-describedby="contactNameError" required>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactNameError" hidden></p>
        </div>
        <div class="contact-field">
          <label for="contactEmail" class="sr-only">Email</label>
          <input type="email" id="contactEmail" name="email" autocomplete="email" placeholder="Email" aria-describedby="contactEmailError" required>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactEmailError" hidden></p>
        </div>
        <div class="contact-field">
          <label for="contactMessage" class="sr-only">Message</label>
          <textarea id="contactMessage" name="message" placeholder="Message" rows="1" maxlength="500" aria-describedby="contactMessageError" required></textarea>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactMessageError" hidden></p>
        </div>
        <button type="submit" class="btn contact-form-submit">Send message</button>
      </form>
      <p class="contact-form-success" id="contactFormSuccess" hidden>Thanks — I'll get back to you soon.</p>
      <p class="contact-form-error" id="contactFormError" hidden>Something went wrong sending your message — please try again.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
