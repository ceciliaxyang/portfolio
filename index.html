<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia — Design</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="wrap">
    <section class="hero" id="work">
      <h1>Cecilia is a designer in Oakland, currently leading teams at Airbnb</h1>
    </section>
  </div>

  <!-- Case study: sticky pinned card stack, cards only -->
  <div class="cs-wrap">
    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device"></div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--lock">
        <span class="cs-lock-grabber"></span>
        <button class="cs-lock-close" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M1 1L19 19M19 1L1 19" stroke="#222" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>

        <div class="cs-lock-pad">
          <svg class="cs-lock-icon" width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="5" y="10" width="14" height="10" rx="2.5" stroke="rgba(255,255,255,0.55)" stroke-width="1.6"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <div class="cs-lock-grid">
            <span>1</span><span>2</span><span>3</span>
            <span>4</span><span>5</span><span>6</span>
            <span>7</span><span>8</span><span>9</span>
          </div>
        </div>

        <h3 class="cs-lock-heading">Connect your lock<br>for smooth check-ins</h3>

        <button class="cs-lock-cta">Connect</button>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device"></div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device"></div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device"></div>
    </section>

    <section class="cs-section cs-card cs-scroll">
      <div class="cs-device"></div>
    </section>
  </div>

  <div class="wrap">
    <section class="contact" id="contact">
      <h2>Get in touch</h2>
      <a class="btn" href="mailto:hello@example.com">Contact me</a>
    </section>
  </div>

  <footer>© 2026 Cecilia</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
