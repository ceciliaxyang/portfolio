<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cecilia — Design</title>
<meta name="description" content="Cecilia is a designer in Oakland, currently leading design teams at Airbnb.">
<!-- Link previews (iMessage, Slack, LinkedIn, X, etc.). The image URL has to be
     absolute and public — the apps fetch it themselves. 1200x630. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://ceciliayang.com/">
<meta property="og:title" content="Cecilia — Design">
<meta property="og:description" content="Cecilia is a designer in Oakland, currently leading design teams at Airbnb.">
<meta property="og:image" content="https://ceciliayang.com/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Cecilia is a designer in Oakland, currently leading design teams at Airbnb, above a preview of her Airbnb host app work.">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/style.css">
<script>
  // Card media (videos + frame images) starts hidden and fades in once loaded
  // (see .js-media in css/style.css; js/main.js marks each card ready). The
  // timeout is a failsafe so media can never stay hidden if that never runs.
  // Skipped for reduced-motion users.
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var root = document.documentElement;
    root.classList.add("js-media");
    setTimeout(function () {
      root.classList.remove("js-media");
    }, 8000);
  })();
</script>
<script>
  // Marks the page as "entrance pending" so the first card starts hidden
  // (see .js-enter in css/style.css) instead of flashing in before its
  // entrance animation in js/main.js runs. Skipped for reduced-motion users
  // and when landing on /contact (including via the 404.html redirect,
  // which stashes the intended path in sessionStorage). The timeout is a
  // failsafe: if the main script never runs, the card still appears.
  (function () {
    var skip =
      window.matchMedia("(prefers-reduced-motion: reduce)").matches ||
      location.pathname === "/contact" ||
      sessionStorage.getItem("redirectPath") === "/contact";
    if (skip) return;
    var root = document.documentElement;
    root.classList.add("js-enter");
    setTimeout(function () {
      root.classList.remove("js-enter");
    }, 4000);
  })();
</script>
</head>
<body>

  <div class="wrap">
    <section class="hero" id="work">
      <h1>Cecilia is a designer in Oakland, currently leading teams at Airbnb</h1>
    </section>
  </div>

  <!-- Case study: sticky pinned card stack, cards only -->
  <div class="cs-wrap">
    <section class="cs-section cs-card cs-pinned cs-first">
      <div class="cs-device cs-device--today">
        <video class="cs-today-video" src="assets/today-tab.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--lock">
        <div class="cs-lock-phone">
          <img class="cs-lock-base" src="assets/lock-screen-base.png" alt="Smart Lock connect screen on an iPhone">
          <video class="cs-lock-video" src="assets/lock-connect-video.mp4" muted loop playsinline preload="auto"></video>
        </div>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--setup">
        <video class="cs-setup-video" src="assets/setup-flow.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--hostactions">
        <video class="cs-hostactions-video" src="assets/host-actions.mp4" muted loop playsinline preload="auto" data-in-view-threshold="0.15" data-play-delay="400"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-pinned">
      <div class="cs-device cs-device--airkey">
        <video class="cs-airkey-video" src="assets/airkey-guest.mp4" muted loop playsinline preload="auto"></video>
      </div>
    </section>

    <section class="cs-section cs-card cs-scroll">
      <div class="cs-device cs-device--tips">
        <div class="cs-tips-phone">
          <img class="cs-tips-frame" src="assets/phone-frame-tips.png" alt="">
          <div class="cs-tips-screen">
            <video class="cs-tips-video" src="assets/tips-enter-exit.mp4" muted loop playsinline preload="auto"></video>
            <img class="cs-tips-nav" src="assets/global-nav.png" alt="">
          </div>
        </div>
      </div>
    </section>
  </div>

  <div class="wrap">
    <section class="contact" id="contact">
      <h2>Get in touch</h2>
      <button type="button" class="btn contact-trigger" id="contactTrigger">Contact me</button>
    </section>
  </div>

  <footer>© 2026</footer>

  <div class="contact-panel" id="contactPanel">
    <button type="button" class="contact-panel-close" id="contactPanelClose" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M1.5 1.5L16.5 16.5M16.5 1.5L1.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="contact-panel-inner" id="contactPanelInner">
      <form class="contact-form" id="contactForm" novalidate>
        <input type="hidden" name="access_key" value="231e0cc0-85c7-4949-98cd-f015edc99929">
        <div class="contact-field">
          <label for="contactName" class="sr-only">Name</label>
          <input type="text" id="contactName" name="name" autocomplete="name" placeholder="Name" aria-describedby="contactNameError" required>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactNameError" hidden></p>
        </div>
        <div class="contact-field">
          <label for="contactEmail" class="sr-only">Email</label>
          <input type="email" id="contactEmail" name="email" autocomplete="email" placeholder="Email" aria-describedby="contactEmailError" required>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactEmailError" hidden></p>
        </div>
        <div class="contact-field">
          <label for="contactMessage" class="sr-only">Message</label>
          <textarea id="contactMessage" name="message" placeholder="Message" rows="1" maxlength="500" aria-describedby="contactMessageError" required></textarea>
          <div class="contact-field-line"></div>
          <p class="contact-field-error" id="contactMessageError" hidden></p>
        </div>
        <button type="submit" class="btn contact-form-submit" id="contactSubmitBtn">
          <span class="contact-form-submit-text">Send message</span>
          <svg class="contact-form-submit-check" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </form>
      <p class="contact-form-error" id="contactFormError" hidden>Something went wrong sending your message — please try again.</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script type="module" src="js/main.js"></script>

</body>
</html>
